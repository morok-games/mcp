<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Commerce Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body { height: 100%; }
        #history { overflow-y: auto; }
        .msg { max-width: 80%; white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body class="d-flex flex-column bg-body-tertiary">
    <header class="border-bottom bg-body py-2">
        <div class="container d-flex justify-content-between align-items-center">
            <span class="fw-semibold">AI Commerce Chat</span>
            <button id="clearBtn" class="btn btn-sm btn-outline-secondary">New chat</button>
        </div>
    </header>

    <main id="history" class="flex-grow-1 py-3">
        <div id="messages" class="container d-flex flex-column gap-2"></div>
    </main>

    <footer class="border-top bg-body py-3">
        <form id="chatForm" class="container d-flex gap-2">
            <textarea id="input" class="form-control" rows="1" placeholder="Ask something..." autofocus></textarea>
            <button id="sendBtn" type="submit" class="btn btn-primary px-4">Send</button>
        </form>
    </footer>

    <script>
        const messages = [];          // full chat history; sent to the server on every request
        const list = document.getElementById('messages');
        const history = document.getElementById('history');
        const form = document.getElementById('chatForm');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');

        function render(role, text, extraClass = '') {
            const div = document.createElement('div');
            div.className = role === 'user'
                ? 'msg align-self-end bg-primary text-white rounded-3 px-3 py-2'
                : `msg align-self-start bg-body border rounded-3 px-3 py-2 ${extraClass}`;
            div.textContent = text;
            list.appendChild(div);
            history.scrollTop = history.scrollHeight;
            return div;
        }

        async function send(text) {
            messages.push({ role: 'user', text });
            render('user', text);

            const pending = render('assistant', 'Thinking…', 'text-secondary');
            sendBtn.disabled = true;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages })
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || err.title || `HTTP ${res.status}`);
                }
                const data = await res.json();
                messages.push({ role: 'assistant', text: data.reply });
                pending.classList.remove('text-secondary');
                pending.textContent = data.reply;
            } catch (e) {
                messages.pop(); // drop the unanswered user message from history
                pending.classList.replace('text-secondary', 'text-danger');
                pending.textContent = 'Error: ' + e.message;
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        form.addEventListener('submit', e => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text || sendBtn.disabled) return;
            input.value = '';
            send(text);
        });

        // Enter sends, Shift+Enter inserts a new line
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                form.requestSubmit();
            }
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            messages.length = 0;
            list.innerHTML = '';
            input.focus();
        });
    </script>
</body>
</html>
